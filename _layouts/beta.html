<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include beta-head.html -%}

  <body class="beta">

    {%- include beta-header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        <article class="post">
          <p class="beta-note">You are looking at the new version of this page.
            <a href="{{ page.classic_url | relative_url }}">Back to the classic version</a></p>
          {%- if page.title -%}
          <header class="post-header">
            <h1 class="post-title">{{ page.title | escape }}</h1>
          </header>
          {%- endif -%}
          <div class="post-content">
            {{ content }}
          </div>
        </article>
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
