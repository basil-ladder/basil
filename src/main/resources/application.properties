spring.main.web-application-type=none
spring.application.name=Basil
spring.datasource.platform=postgres
# Hibernate 6+ defaults to one sequence per table; the schema has the single shared hibernate_sequence.
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=legacy
# Hibernate 6+ stores Instants as UTC; the existing timestamp columns hold the server's local time, as written by Hibernate 5.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=postgres
spring.datasource.password=
