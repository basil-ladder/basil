basil.publishSchedule=0 * * * * *
basil.publishCommand=/bin/bash
basil.publishBasePath=/tmp
basil.basilBotSource=/home/dante/localbots.json
#basil.gameResultsHours=48
basil.dataBasePath=/tmp
basil.botBinariesHistoryPath=/tmp
basil.parallelGamesCount=1
basil.botUpdateSchedule=0 * * * * *
scbw.realtimeTimeoutSeconds=30
#scbw.frameTimeout=2400
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
scbw.deleteGamesInGameDir=false

